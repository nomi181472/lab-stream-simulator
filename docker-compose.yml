services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: streamlab-mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"       # RTSP
      - "1935:1935"       # RTMP
      - "8888:8888"       # HLS
      - "8889:8889"       # WebRTC
      - "9997:9997"       # MediaMTX Control API
    volumes:
      - ./config/mediamtx/mediamtx.yml:/mediamtx.yml:ro

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: botonetics/streamlab-backend:latest
    container_name: streamlab-backend
    restart: unless-stopped
    ports:
      - "8000:8000"       # FastAPI Core REST, SOAP, WebSockets
      - "3702:3702/udp"   # WS-Discovery Multicast Probe
    environment:
      - STREAMLAB_ENV=production
      - API_PORT=8000
      - RTSP_PORT=8554
      - RTMP_PORT=1935
      - MEDIAMTX_HOST=mediamtx
      - MEDIAMTX_API_URL=http://mediamtx:9997
      - DATABASE_URL=sqlite+aiosqlite:////app/data/streamlab.db
    volumes:
      - ./data:/app/data
      - ./videos:/app/videos
    depends_on:
      - mediamtx

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: botonetics/streamlab-frontend:latest
    container_name: streamlab-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws/cameras
      - NEXT_PUBLIC_BACKEND_HOST=http://backend:8000
    depends_on:
      - backend

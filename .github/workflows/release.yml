name: Release & Build Windows Installer

'on':
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.1)'
        required: true
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Ensure MediaMTX Windows Binary Exists
        shell: pwsh
        run: |
          if (-not (Test-Path "bin\mediamtx.exe")) {
            Write-Host "Downloading MediaMTX for Windows..."
            New-Item -ItemType Directory -Force -Path "bin"
            Invoke-WebRequest -Uri "https://github.com/bluenviron/mediamtx/releases/download/v1.21.0/mediamtx_v1.21.0_windows_amd64.zip" -OutFile "mediamtx.zip"
            Expand-Archive -Path "mediamtx.zip" -DestinationPath "bin" -Force
            Remove-Item "mediamtx.zip" -Force
          }

      - name: Install Python Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r backend/requirements.txt
          pip install pyinstaller pystray pillow email-validator

      - name: Build Next.js Static Frontend
        working-directory: frontend
        shell: cmd
        env:
          NEXT_EXPORT: "true"
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          call npm install --no-audit
          call npm run build

      - name: Verify Frontend Static Export
        shell: pwsh
        run: |
          if (-not (Test-Path "frontend/out/index.html")) {
            Write-Error "CRITICAL: frontend/out/index.html does not exist! Next.js static export failed."
            exit 1
          }
          Write-Host "Verified: frontend/out/index.html exists ($((Get-Item frontend/out/index.html).Length) bytes)."

      - name: Compile Backend & Bundle Assets with PyInstaller
        shell: cmd
        run: |
          python -m PyInstaller --noconfirm StreamLab.spec

      - name: Copy Auxiliary Directories into dist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/StreamLab/videos", "dist/StreamLab/bin", "dist/StreamLab/config", "dist/StreamLab/frontend/out"
          if (Test-Path "videos") { Copy-Item -Path "videos/*" -Destination "dist/StreamLab/videos" -Recurse -Force }
          if (Test-Path "bin") { Copy-Item -Path "bin/*" -Destination "dist/StreamLab/bin" -Recurse -Force }
          if (Test-Path "config") { Copy-Item -Path "config/*" -Destination "dist/StreamLab/config" -Recurse -Force }
          Copy-Item -Path "frontend/out/*" -Destination "dist/StreamLab/frontend/out" -Recurse -Force
          if (-not (Test-Path "dist/StreamLab/frontend/out/index.html")) {
            Write-Error "CRITICAL: dist/StreamLab/frontend/out/index.html is missing before Inno Setup compilation!"
            exit 1
          }
          Write-Host "dist/StreamLab/frontend/out populated with $((Get-ChildItem -Recurse dist/StreamLab/frontend/out).Count) files."

      - name: Create Portable Zip Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist-installer"
          $zipName = "dist-installer/StreamLab-Portable-Windows.zip"
          Compress-Archive -Path "dist/StreamLab/*" -DestinationPath $zipName -Force
          Write-Host "Created portable archive: $zipName ($((Get-Item $zipName).Length) bytes)"

      - name: Compile Inno Setup Installer (.EXE)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            $cmd = Get-Command iscc.exe -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
          }
          Write-Host "Compiling installer with: $iscc"
          & $iscc installer\StreamLab.iss

      - name: Extract Tag & Release Notes
        id: release_info
        shell: pwsh
        run: |
          $ref = "${{ github.ref }}"
          $tagName = $ref -replace '^refs/tags/', ''
          if ([string]::IsNullOrWhiteSpace($tagName) -or $tagName.StartsWith("refs/heads/")) {
            $tagName = "${{ github.event.inputs.version }}"
          }
          if ([string]::IsNullOrWhiteSpace($tagName)) {
            $tagName = "v" + (Get-Content -Path "VERSION" -Raw).Trim()
          }
          Write-Output "tag_name=$tagName" >> $env:GITHUB_OUTPUT

          $tagMsg = git tag -l --format='%(contents)' $tagName
          if ([string]::IsNullOrWhiteSpace($tagMsg)) {
            $tagMsg = "Automated release $tagName of StreamLab Virtual IP Camera Simulator."
          }
          "tag_message<<EOF" >> $env:GITHUB_OUTPUT
          $tagMsg >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release and Upload Installer
        uses: softprops/action-gh-release@v2
        with:
          name: StreamLab ${{ steps.release_info.outputs.tag_name }}
          body: ${{ steps.release_info.outputs.tag_message }}
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          files: |
            dist-installer/StreamLab-Setup-*.exe
            dist-installer/StreamLab-Portable-*.zip
          generate_release_notes: true

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            build/
            dist/

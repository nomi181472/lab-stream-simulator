name: Release & Build Windows Installer

'on':
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.1)'
        required: true
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Ensure MediaMTX Windows Binary Exists
        shell: pwsh
        run: |
          if (-not (Test-Path "bin\mediamtx.exe")) {
            Write-Host "Downloading MediaMTX for Windows..."
            New-Item -ItemType Directory -Force -Path "bin"
            Invoke-WebRequest -Uri "https://github.com/bluenviron/mediamtx/releases/download/v1.21.0/mediamtx_v1.21.0_windows_amd64.zip" -OutFile "mediamtx.zip"
            Expand-Archive -Path "mediamtx.zip" -DestinationPath "bin" -Force
            Remove-Item "mediamtx.zip" -Force
          }

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller pystray pillow

      - name: Build Next.js Static Frontend
        env:
          NEXT_EXPORT: "true"
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..

      - name: Compile Backend & Bundle Assets with PyInstaller
        run: |
          pyinstaller --noconfirm StreamLab.spec

      - name: Copy Auxiliary Directories into dist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/StreamLab/videos", "dist/StreamLab/bin", "dist/StreamLab/config", "dist/StreamLab/frontend/out"
          Copy-Item -Path "videos/*" -Destination "dist/StreamLab/videos" -Recurse -Force
          Copy-Item -Path "bin/*" -Destination "dist/StreamLab/bin" -Recurse -Force
          Copy-Item -Path "config/*" -Destination "dist/StreamLab/config" -Recurse -Force
          Copy-Item -Path "frontend/out/*" -Destination "dist/StreamLab/frontend/out" -Recurse -Force

      - name: Compile Inno Setup Installer (.EXE)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            $cmd = Get-Command iscc.exe -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
          }
          Write-Host "Compiling installer with: $iscc"
          & $iscc installer\StreamLab.iss

      - name: Extract Tag & Release Notes
        id: release_info
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "refs/heads/main" ]; then
            TAG_NAME="${{ github.event.inputs.version }}"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

          TAG_MESSAGE=$(git tag -l --format='%(contents)' "$TAG_NAME" 2>/dev/null || echo "")
          if [ -z "$TAG_MESSAGE" ]; then
            TAG_MESSAGE="Automated release $TAG_NAME of StreamLab Virtual IP Camera Simulator."
          fi
          echo "tag_message<<EOF" >> $GITHUB_OUTPUT
          echo "$TAG_MESSAGE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and Upload Installer
        uses: softprops/action-gh-release@v2
        with:
          name: StreamLab ${{ steps.release_info.outputs.tag_name }}
          body: ${{ steps.release_info.outputs.tag_message }}
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          files: dist-installer/StreamLab-Setup-*.exe
          generate_release_notes: true
